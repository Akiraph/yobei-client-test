name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows desktop (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            core -> target

      - name: Install dependencies
        run: bun install

      - name: Build Windows bundle
        run: bun run build:release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: yobei-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            core -> target

      - name: Install dependencies
        run: bun install

      - name: Build Android release APK
        run: bun run tauri android build --apk --ci

      - name: Verify Android release APK
        shell: bash
        run: |
          apk_count="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No Android release APK was produced."
            exit 1
          fi
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: yobei-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: yobei-windows
          path: release-assets/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: yobei-android-release
          path: release-assets/android

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yobei $GITHUB_REF_NAME" \
            --generate-notes
