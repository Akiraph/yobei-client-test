name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows desktop (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            core -> target

      - name: Install dependencies
        run: bun install

      - name: Build Windows bundle
        run: bun run build:release

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: yobei-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.13

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            core -> target

      - name: Install dependencies
        run: bun install

      - name: Build Android release APK
        run: bun run tauri android build --apk --ci

      - name: Sign Android release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is not set; skipping signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore.jks

          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release-unsigned.apk' | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned APK found to sign."
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"

          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          SIGNED="src-tauri/gen/android/app/build/outputs/apk/release/app-universal-release-signed.apk"
          mkdir -p "$(dirname "$SIGNED")"

          "$BT/apksigner" sign \
            --ks release.keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$BT/apksigner" verify --print-certs "$SIGNED"
          echo "Signed APK: $SIGNED"

      - name: Verify Android release APK
        shell: bash
        run: |
          apk_count="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -eq 0 ]; then
            echo "No Android release APK was produced."
            exit 1
          fi
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: yobei-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
