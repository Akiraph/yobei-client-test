[package]
name = "yobei-client"
version = "0.1.0"
description = "Yobei zero-knowledge password manager"
license = "AGPL-3.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/tauri-plugin-yobei-biometric"]

[lib]
name = "yobei_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-yobei-biometric = { path = "crates/tauri-plugin-yobei-biometric" }
rusqlite = { version = "0.31", features = ["bundled"] }
yobei-core = { path = "../core" }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "system-proxy"] }
chrono = "0.4"
tokio = { version = "1", features = ["net", "sync", "rt", "time", "io-util", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"
zeroize = "1"
rqrr = "0.8"

[dev-dependencies]
qrcode = "0.14"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Security_Credentials_UI", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_StationsAndDesktops"] }
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep unlock crypto speed-optimized without changing the KDF or its stored
# parameters. The application is size-optimized, but Argon2 is a hot path and
# must not inherit the slower size profile on Android or Windows.
[profile.dev.package.yobei-core]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release.package.yobei-core]
opt-level = 3

[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3
